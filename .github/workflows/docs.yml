name: Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Configure
        run: cmake -S . -B build -DTHREADPOOL_BUILD_TESTS=OFF -DTHREADPOOL_BUILD_EXAMPLES=OFF
      - name: Build documentation (warnings are errors)
        run: cmake --build build --target docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-time prerequisite: Settings > Pages > Source = GitHub Actions.
      # The workflow token cannot enable a previously disabled Pages site.
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
